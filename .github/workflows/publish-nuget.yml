              return $null
          }

          $flatUrl = "https://api.nuget.org/v3-flatcontainer/$($packageId.ToLower())/index.json"
          $latestOnNuget = $null
          try {
              $resp = Invoke-RestMethod -Uri $flatUrl
              if ($resp.versions.Count -gt 0) {
                  $latestOnNuget = $resp.versions | Where-Object { Get-VersionObj $_ } |
                      Sort-Object { Get-VersionObj $_ } -Descending | Select-Object -First 1
              }
          } catch {
              Write-Host "no published version found for $packageId yet."
          }

          $newVersion = $currentVersion
          if ($latestOnNuget) {
              Write-Host "latest on nuget.org: $latestOnNuget"
              $curV = Get-VersionObj $currentVersion
              $pubV = Get-VersionObj $latestOnNuget
              if ($curV -and $pubV -and $curV -le $pubV) {
                  # Preserve the prerelease suffix from the project version (e.g. -beta, -rc.1).
                   $suffix = [regex]::Match(
                       $currentVersion,
                       '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?'
                   ).Groups[1].Value

                   $newVersion = "$($pubV.Major).$($pubV.Minor).$($pubV.Build + 1)$suffix"
                  Write-Host "bumping to $newVersion"
              } else {
                  Write-Host "local version already ahead -> publishing $currentVersion as-is"
              }
          } else {
              Write-Host "first publish -> using $currentVersion as-is"
          }

          if ($newVersion -ne $currentVersion) {
              ($vxml.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version = $newVersion
              $vxml.Save($versionFile)

              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add $versionFile
              git commit -m "chore: bump $packageId to $newVersion [skip ci]"
              git push
              if ($LASTEXITCODE -ne 0) { throw "failed to push version bump commit." }
          }

          "version=$newVersion" >> $env:GITHUB_OUTPUT

      - name: Pack
        id: pack
        shell: pwsh
        run: |
          $outDir = Join-Path $PWD "artifacts/${{ steps.info.outputs.package_id }}"
          dotnet pack "${{ steps.info.outputs.csproj_path }}" -c Release --output $outDir
          if ($LASTEXITCODE -ne 0) { throw "dotnet pack failed." }

          $nupkg = Get-ChildItem -Path $outDir -Filter "*.nupkg" |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $nupkg) { throw "No .nupkg produced." }

          "path=$($nupkg.FullName)" >> $env:GITHUB_OUTPUT

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet.org
        shell: pwsh
        run: |
          dotnet nuget push "${{ steps.pack.outputs.path }}" `
            --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" `
            --source https://api.nuget.org/v3/index.json `
            --skip-duplicate

      - name: Unlist every older version on nuget.org
        shell: pwsh
        run: |
          $packageId = "${{ steps.info.outputs.package_id }}"
          $published = "${{ steps.version.outputs.version }}"
          $flatUrl = "https://api.nuget.org/v3-flatcontainer/$($packageId.ToLower())/index.json"

          try {
            $resp = Invoke-RestMethod -Uri $flatUrl
          } catch {
            Write-Host "could not query flatcontainer for $packageId, skipping unlist step."
            exit 0
          }

          foreach ($v in $resp.versions) {
            if ($v -ne $published) {
              Write-Host "unlisting $packageId $v ..."
              dotnet nuget delete $packageId $v `
                --source https://api.nuget.org/v3/index.json `
                --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" `
                --non-interactive
              if ($LASTEXITCODE -ne 0) {
                Write-Host "::warning::failed to unlist $packageId $v (exit code $LASTEXITCODE) - continuing"
              }
            }
          }
          exit 0

      - name: Push same package to GitHub Packages
        shell: pwsh
        run: |
          dotnet nuget push "${{ steps.pack.outputs.path }}" `
            --api-key ${{ secrets.GITHUB_TOKEN }} `
            --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json `
            --skip-duplicate

      - name: Delete every older version in GitHub Packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $packageId = "${{ steps.info.outputs.package_id }}"
          $published = "${{ steps.version.outputs.version }}"
          $owner     = "${{ github.repository_owner }}"

          $base = "orgs/$owner/packages/nuget/$packageId/versions"
          $versionsJson = gh api $base 2>$null
          if ($LASTEXITCODE -ne 0) {
            $base = "users/$owner/packages/nuget/$packageId/versions"
            $versionsJson = gh api $base
          }

          $versions = $versionsJson | ConvertFrom-Json
          foreach ($v in $versions) {
            if ($v.name -ne $published) {
              Write-Host "deleting GitHub Packages version $($v.name) (id $($v.id)) ..."
              gh api -X DELETE "$base/$($v.id)"
              if ($LASTEXITCODE -ne 0) {
                Write-Host "::warning::failed to delete GitHub Packages version $($v.name) (exit code $LASTEXITCODE) - continuing"
              }
            }
          }
          exit 0